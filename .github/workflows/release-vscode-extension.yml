name: Release VS Code Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Validate tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run bundle

      - name: Package VSIX
        run: npx @vscode/vsce package --out llm-auto-confirm-${{ github.ref_name }}.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-extension/llm-auto-confirm-${{ github.ref_name }}.vsix
          generate_release_notes: true

      - name: Publish to VS Code Marketplace (optional)
        if: ${{ secrets.VSCE_PAT != '' }}
        run: npx @vscode/vsce publish --packagePath llm-auto-confirm-${{ github.ref_name }}.vsix --pat "${{ secrets.VSCE_PAT }}"
